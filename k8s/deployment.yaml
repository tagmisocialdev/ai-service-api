apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: registry.digitalocean.com/REPLACE_REGISTRY/ai-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
