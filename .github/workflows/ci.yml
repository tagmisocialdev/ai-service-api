name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        run: npm ci

      - name: Generate protobuf TypeScript
        run: npm run generate:proto

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test || true

      # Build and push docker (placeholder - requires secrets)
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: |
            REPLACE_REGISTRY/${{ github.repository }}:latest
